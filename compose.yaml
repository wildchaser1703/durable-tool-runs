services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_DB: durable_runs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable_runs"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_DB: durable_runs_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable_runs_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  provider:
    build: .
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    command: uvicorn app.provider:app --host 0.0.0.0 --port 8081
    environment:
      PROVIDER_DATABASE_PATH: /data/effects.db
    volumes:
      - provider_data:/data
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://durable:durable@postgres:5432/durable_runs
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://durable:durable@postgres:5432/durable_runs
      TOOL_PROVIDER_URL: http://provider:8081
      API_TOKEN: ${API_TOKEN:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-0}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build: .
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://durable:durable@postgres:5432/durable_runs
      TOOL_PROVIDER_URL: http://provider:8081
      METRICS_PORT: "9100"
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  provider_data:

