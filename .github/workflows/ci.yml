name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
          POSTGRES_DB: durable_runs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable -d durable_runs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check app examples tests scripts alembic
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://durable:durable@localhost:5432/durable_runs
      - name: Verify the composed production-shaped stack
        run: docker compose up -d --build --wait
        env:
          POSTGRES_PORT: "5434"
      - name: Verify a real two-step run, event cursor and metrics
        run: python scripts/smoke.py
      - name: Tear down stack
        if: always()
        run: docker compose down -v
