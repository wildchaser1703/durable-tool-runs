[project]
name = "durable-tool-runs"
version = "0.3.0"
description = "A recoverable execution service for durable tool runs."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
ai = ["torch>=2.5,<3", "transformers>=4.48,<5"]

[tool.setuptools.packages.find]
include = ["app*", "examples*"]

[tool.setuptools.package-data]
app = ["static/*"]
examples = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

